<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>links</title>
    <style>
        /*   seletores prsonalizados 
            
            # = id 
            . = class
            : = pseudo-class
            :: = pseudo-element
            > = children*/
           
           
        body{
            font-family: Arial, Helvetica, sans-serif;
            
        }

        a { 
            color: blue;
            text-decoration: none;
            font-weight: bold;
        }

        a:visited {
            color: lightblue;
            }

        a:hover {
            color:rgb(236, 120, 120);
            text-decoration: underline;
        }

        a:active {
            color: rgb(90, 250, 90);
        }

        a::after { 
            content: '[link]';
            text-decoration: none;
            font-weight: normal;
            color: lightgrey;
        }
         
        .especial {
            background-color: rgb(226, 154, 154);
        }



    </style>
</head>
<body>
    <h1>Personalizando links</h1>

    <li><a href="https://gustavoguanabara.github.yo" target="_blank">Repositório github</a></li>
    <li><a href="https://youtu.be/vMlrcOVr7po?si=lPbNyLLYhxBVM8Af" target="_blank" class="especial">Canal do youtube</a></li>
    <li> <a href="https://www.cursoemvideo.com" target="_blank">Site do cursoemvideo</a></li>
    
</body>
</html>
